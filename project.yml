name: Seesee
options:
  bundleIdPrefix: com.cleiyf
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Seesee:
    type: application
    platform: iOS
    sources:
      - path: Seesee
        excludes: ["Resources/**"]
      # 保留目录结构，运行时按 js/lib/xxx.js 读取（对应 assets://js/lib/xxx.js）
      - path: Seesee/Resources/js
        type: folder
        buildPhase: resources
    info:
      path: Seesee/Info.plist
      properties:
        CFBundleDisplayName: Seesee
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleiyf.seesee
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  SeeseeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SeeseeTests]
    dependencies:
      - target: Seesee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Seesee:
    build:
      targets:
        Seesee: all
    test:
      targets: [SeeseeTests]
